<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Ben &amp; Amie · Our Little World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A little floating world Ben made for Amie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,100;1,9..144,400..700,100&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: one full-bleed sunset stage (WebGL island) with HTML layers on top —
   invitation, floating object tags, a bottom dock, and paper panels that slide in
   from the right on wide screens and up from the bottom on phones.
   Deliberately single-look: a warm sunset world, the same in light and dark. */
:root{
  --blush:#F2A7B8;
  --peach:#FFC8A2;
  --cream:#FFF6EA;
  --paper:#FFFAF3;
  --sage:#A9C29B;
  --gold:#F5C46E;
  --rose:#B84466;
  --rose-deep:#8E2F4C;
  --ink:#4A2C36;
  --ink-soft:#7A5560;
  --line:rgba(74,44,54,.14);
  --glass:rgba(255,248,240,.84);
  --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-body:"Nunito","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --font-hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --radius:22px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#FFE2C8;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100;text-wrap:balance;margin:0;font-weight:560;letter-spacing:-.01em}
.hand{font-family:var(--font-hand)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───── stage ───── */
#app{position:fixed;inset:0;overflow:hidden}
#sky{position:absolute;inset:0;background:
  radial-gradient(60% 42% at 72% 64%, rgba(255,236,190,.95) 0%, rgba(255,214,170,.55) 38%, rgba(255,200,170,0) 72%),
  linear-gradient(180deg,#F5AFC2 0%,#F9C0BC 30%,#FFD5BC 58%,#FFE6CB 80%,#FFEEDB 100%)}
#sky::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background:
  radial-gradient(50% 36% at 50% 72%, rgba(255,190,150,.7), rgba(255,190,150,0) 70%),
  linear-gradient(180deg,#9E5C86 0%,#C9718F 34%,#EE9A9C 64%,#FFC3A2 100%)}
#app.dusk #sky::after{opacity:1}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene.grab{cursor:grab}
#scene.point{cursor:pointer}
#fallbackArt{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:90px}
#fallbackArt svg{width:min(88vw,560px);height:auto;filter:drop-shadow(0 30px 40px rgba(150,70,80,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* ───── shared buttons ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;padding:.8rem 1.5rem;font-weight:800;font-size:1rem;letter-spacing:.01em;min-height:48px;transition:transform .15s ease, box-shadow .15s ease, background .2s}
.btn-primary{background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-deep),0 14px 28px rgba(142,47,76,.28)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-deep),0 8px 18px rgba(142,47,76,.25)}
.btn-soft{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 #E8CDB6,0 10px 22px rgba(120,60,60,.12)}
.btn-soft:active{transform:translateY(3px);box-shadow:0 1px 0 #E8CDB6}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:var(--glass);box-shadow:0 3px 0 rgba(200,150,140,.45),0 8px 18px rgba(120,60,60,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.icon-btn svg{width:20px;height:20px}
.pill-btn{display:inline-flex;align-items:center;gap:.45rem;height:44px;padding:0 1rem 0 .8rem;border-radius:999px;border:0;background:var(--glass);font-weight:700;font-size:.9rem;box-shadow:0 3px 0 rgba(200,150,140,.45),0 8px 18px rgba(120,60,60,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill-btn svg{width:18px;height:18px;flex:none}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

/* ───── fades ───── */
.fade{opacity:0;transition:opacity .45s ease, transform .45s ease}
.fade.on{opacity:1}

/* ───── invitation ───── */
#invite{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;text-align:center;pointer-events:none;
  padding-top:calc(var(--safe-t) + clamp(56px,9vh,96px));padding-bottom:calc(var(--safe-b) + clamp(28px,6vh,64px));padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
#invite > *{pointer-events:auto}
.invite-head{display:grid;gap:.35rem;max-width:34rem}
.invite-to{font-size:clamp(1.35rem,3.4vw,1.7rem);color:var(--rose-deep);margin:0;transform:rotate(-2deg)}
#invite h1{font-size:clamp(2rem,6.2vw,3.5rem);line-height:1.04;color:var(--ink);text-shadow:0 2px 0 rgba(255,246,234,.6)}
.invite-foot{display:grid;gap:.7rem;justify-items:center}
.invite-from{margin:0;font-size:1.1rem;color:var(--ink-soft)}
.invite-envelope-gap{pointer-events:none!important}
.css-envelope{display:none}
.no3d .css-envelope{display:block;position:relative;width:min(78vw,340px);aspect-ratio:1.55;margin:auto;filter:drop-shadow(0 22px 28px rgba(140,60,70,.25));animation:float 5s ease-in-out infinite}
.css-envelope .body{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#FFF8EE,#FBE7D5)}
.css-envelope .flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,#FCEBDD,#F6D9C5);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.css-envelope .seal{position:absolute;left:50%;top:52%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E07A95,var(--rose) 70%);display:grid;place-items:center;color:#FFE3EA;font-size:22px}
.css-envelope .to{position:absolute;bottom:12%;left:0;right:0;font-family:var(--font-hand);font-size:1.5rem;color:var(--ink)}

/* ───── top bar ───── */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(var(--safe-t) + 14px);padding-left:var(--gutter-l);padding-right:var(--gutter-r);pointer-events:none;z-index:20}
#topbar > *{pointer-events:auto}
.brand{font-family:var(--font-display);font-style:italic;font-size:1.15rem;color:var(--ink);background:var(--glass);padding:.4rem .95rem;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 0 rgba(200,150,140,.45)}
.brand .amp{color:var(--rose)}
.top-actions{display:flex;gap:10px;margin-left:auto}
@media (max-width:520px){.pill-btn .txt{display:none}.pill-btn{width:44px;padding:0;justify-content:center}}

/* ───── object tags (3D-anchored) ───── */
#tags{position:absolute;inset:0;pointer-events:none;z-index:5}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.45rem;padding:.42rem .8rem .42rem .5rem;border:0;border-radius:999px;background:var(--glass);
  font-weight:800;font-size:.85rem;color:var(--ink);white-space:nowrap;pointer-events:auto;box-shadow:0 3px 0 rgba(200,150,140,.5),0 8px 16px rgba(120,60,60,.14);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s ease;will-change:transform}
.tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:rgba(255,248,240,.9);transform:translateX(-50%)}
.pip{position:relative;width:12px;height:12px;border-radius:50%;background:var(--rose);flex:none}
.pip::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--rose);opacity:.6;animation:pulse 2.2s ease-out infinite}
.tag.visited .pip{background:var(--sage)}
.tag.visited .pip::before{border-color:var(--sage);animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.7);opacity:0}}

/* ───── dock ───── */
#dock{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--glass);
  box-shadow:0 4px 0 rgba(200,150,140,.45),0 18px 36px rgba(120,60,60,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20;
  width:min(620px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.dock-btn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border:0;border-radius:18px;background:transparent;font-weight:800;font-size:.78rem;line-height:1.15;color:var(--ink);position:relative}
.dock-btn svg{width:24px;height:24px;color:var(--rose)}
.dock-btn:hover{background:rgba(242,167,184,.22)}
.dock-btn .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-btn.visited::after{content:"";position:absolute;top:7px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 2px var(--cream)}
.dock-btn.special svg{color:var(--rose-deep)}
@media (max-width:440px){#dock{gap:2px}.dock-btn{font-size:.68rem;padding:8px 2px 7px}.dock-btn .lbl{white-space:normal;text-align:center}}

#hint{position:absolute;left:50%;bottom:calc(var(--safe-b) + 104px);transform:translateX(-50%);max-width:min(420px,calc(100% - 32px));text-align:center;
  background:var(--ink);color:var(--cream);padding:.65rem 1rem;border-radius:16px;font-size:.9rem;font-weight:600;z-index:19;box-shadow:0 10px 24px rgba(74,44,54,.25)}

/* ───── panel ───── */
#panel{position:absolute;z-index:30;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(110,50,60,.28),0 0 0 1px rgba(255,255,255,.6) inset}
#panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(180,120,100,.08) 1px,transparent 1.2px);background-size:7px 7px}
@media (min-width:820px){
  #panel{top:calc(var(--safe-t) + 16px);bottom:calc(var(--safe-b) + 16px);right:var(--gutter-r);width:min(460px,44vw);border-radius:28px;transform:translateX(24px)}
  #panel.on{transform:none}
  #app.panel-open .top-actions{margin-right:calc(min(460px,44vw) + 12px)}
}
@media (max-width:819.98px){
  #panel{left:0;right:0;bottom:0;max-height:76%;height:76%;border-radius:28px 28px 0 0;transform:translateY(30px);padding-bottom:var(--safe-b)}
  #panel.on{transform:none}
  #panel .grabber{display:block}
}
.grabber{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.panel-head{position:relative;display:flex;align-items:flex-start;gap:12px;padding:20px 20px 10px 24px}
.panel-head .eyebrow{display:block;font-family:var(--font-hand);font-size:1.1rem;color:var(--rose);margin-bottom:2px}
.panel-head h2{font-size:clamp(1.5rem,4vw,1.9rem);line-height:1.1}
.panel-head h2:focus{outline:none}
.panel-head .icon-btn{margin-left:auto;flex:none;background:var(--cream)}
.panel-body{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 24px 20px;min-height:0}
.panel-foot{position:relative;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:14px 20px 18px;border-top:1px dashed var(--line)}
.panel-foot .btn{flex:1 1 auto;padding:.7rem 1.1rem;font-size:.95rem}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7C5A1E;background:#FCEBC4;border-radius:999px;padding:.25rem .65rem;margin-bottom:12px}
.lede{color:var(--ink-soft);margin:.2rem 0 1rem;max-width:60ch}

/* story */
.story-stage{display:grid;gap:18px;touch-action:pan-y}
.polaroid{position:relative;margin:10px auto 0;width:min(100%,330px);background:#FFFDF8;padding:12px 12px 0;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 14px 30px rgba(120,60,60,.18);transform:rotate(var(--tilt,-2deg));transition:transform .5s ease}
.polaroid::before,.polaroid::after{content:"";position:absolute;top:-12px;width:78px;height:24px;background:rgba(245,196,110,.55);mix-blend-mode:multiply;border-radius:2px}
.polaroid::before{left:-14px;transform:rotate(-32deg)}
.polaroid::after{right:-14px;transform:rotate(28deg);background:rgba(242,167,184,.55)}
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:2px;background:var(--cream)}
.photo img,.photo svg{display:block;width:100%;height:100%;object-fit:cover}
.photo .stick{position:absolute;right:8px;bottom:8px;font-family:var(--font-hand);font-size:.95rem;color:var(--ink);background:rgba(255,250,243,.88);padding:.1rem .55rem;border-radius:8px;transform:rotate(-3deg)}
.polaroid figcaption{font-family:var(--font-hand);font-size:1.3rem;text-align:center;padding:.5rem 0 .65rem;color:var(--ink)}
.story-text .kicker{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);margin:0 0 .25rem}
.story-text h3{font-size:1.45rem;line-height:1.15;margin-bottom:.4rem}
.story-text p{margin:0;max-width:60ch}
.story-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:30px;height:30px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);transition:all .25s}
.dot[aria-current="true"]::before{background:var(--rose);width:22px;border-radius:6px}
.story-nav .icon-btn{background:var(--cream)}
.icon-btn:disabled{opacity:.35;cursor:default}
.swap{animation:swap .45s ease both}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* notes */
.notes{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:6px}
.bloom{border:0;background:transparent;display:grid;justify-items:center;gap:4px;padding:8px 16px;border-radius:24px;font-weight:800;color:var(--rose-deep)}
.bloom svg{width:120px;height:120px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.bloom.spin svg{transform:rotate(72deg) scale(1.06)}
.bloom:hover{background:rgba(242,167,184,.18)}
.note-card{position:relative;margin:0;width:100%;max-width:26rem;background:#FFF1D8;border-radius:6px;padding:28px 26px 18px;box-shadow:0 12px 26px rgba(150,90,60,.16);transform:rotate(1.2deg)}
.note-card::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(169,194,155,.6);border-radius:2px}
.note-card p{font-family:var(--font-display);font-size:clamp(1.25rem,3.6vw,1.5rem);line-height:1.35;margin:0 0 .6rem;font-variation-settings:"SOFT" 100;font-weight:450}
.note-card footer{font-family:var(--font-hand);color:var(--ink-soft);font-size:1.05rem}

/* letter */
.letter{position:relative;background:#FFF5E6;border-radius:6px;padding:30px 26px 34px;box-shadow:0 1px 0 #EAD9C3,0 14px 30px rgba(150,90,60,.14);
  background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(184,68,102,.10) 31px 32px);background-position:0 18px}
.letter-date{margin:0 0 .6rem;text-align:right;color:var(--ink-soft);font-size:1.1rem}
.letter .greet{font-family:var(--font-display);font-style:italic;font-size:1.5rem;margin:0 0 .8rem}
.letter p{margin:0 0 1rem;font-size:1.06rem;line-height:1.75;max-width:60ch}
.letter .closing{margin:1.6rem 0 0;font-size:1.06rem}
.letter .sig{font-family:var(--font-hand);font-size:2rem;color:var(--rose);margin:.1rem 0 0;transform:rotate(-3deg);transform-origin:left;display:inline-block}
.letter .stamp{position:absolute;top:-14px;right:16px;width:58px;height:66px;background:var(--blush);border-radius:4px;display:grid;place-items:center;transform:rotate(6deg);
  -webkit-mask:radial-gradient(circle 4px at 4px 4px,transparent 98%,#000) -4px -4px/8px 8px;mask:radial-gradient(circle 4px at 4px 4px,transparent 98%,#000) -4px -4px/8px 8px}
.letter .stamp svg{width:30px;height:30px}

/* adventures */
.tickets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ticket{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;text-align:left;border:0;border-radius:16px;padding:14px 16px;background:#FFF1E2;
  box-shadow:0 3px 0 #EBD3BE;position:relative;transition:background .2s, transform .15s}
.ticket:active{transform:translateY(2px)}
.ticket .ico{width:44px;height:44px;border-radius:14px;background:var(--cream);display:grid;place-items:center;color:var(--rose)}
.ticket .ico svg{width:24px;height:24px}
.ticket strong{display:block;font-family:var(--font-display);font-size:1.12rem;font-weight:560;line-height:1.2}
.ticket span.note{display:block;color:var(--ink-soft);font-size:.92rem;margin-top:2px}
.ticket .yes{font-family:var(--font-hand);font-size:1.05rem;color:var(--ink-soft);white-space:nowrap;padding:.2rem .6rem;border-radius:999px;border:2px dashed var(--line)}
.ticket[aria-pressed="true"]{background:#FCE0E6}
.ticket[aria-pressed="true"] .yes{color:#fff;background:var(--rose);border-color:var(--rose)}
@media (max-width:400px){.ticket{grid-template-columns:40px 1fr;}.ticket .yes{grid-column:2;justify-self:start}}

/* ───── finale ───── */
#finale{position:absolute;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  padding-bottom:calc(var(--safe-b) + 18px);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.finale-card{pointer-events:auto;width:min(560px,100%);text-align:center;background:rgba(255,248,240,.9);border-radius:30px;padding:24px 22px 20px;
  box-shadow:0 24px 60px rgba(80,30,50,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateY(20px);transition:transform .7s ease, opacity .7s ease}
#finale.on .finale-card{transform:none}
.finale-names{margin:0;font-family:var(--font-hand);font-size:1.35rem;color:var(--rose)}
.counter{margin:.2rem 0 0;display:flex;align-items:baseline;justify-content:center;gap:.5rem;flex-wrap:wrap}
.counter .num{font-family:var(--font-display);font-size:clamp(3rem,11vw,4.6rem);line-height:1;font-weight:600;color:var(--rose-deep);font-variant-numeric:tabular-nums;font-variation-settings:"SOFT" 100}
.counter .unit{font-weight:800;font-size:1.05rem}
.since{margin:.25rem 0 0;color:var(--ink-soft);font-size:.95rem;text-wrap:balance}
#finaleTitle{font-size:clamp(1.7rem,5.4vw,2.5rem);line-height:1.08;margin:.8rem 0 .2rem}
#finaleTitle:focus{outline:none}
.finale-msg{margin:0 0 1rem;font-family:var(--font-hand);font-size:1.5rem;color:var(--ink)}
.finale-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.finale-actions .btn{padding:.7rem 1.15rem;font-size:.95rem}

#cssLanterns{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.lan{position:absolute;bottom:-60px;width:18px;height:24px;border-radius:7px 7px 9px 9px;background:radial-gradient(circle at 50% 60%,#FFF1C2,#FFB36B 60%,#F08A5D);
  box-shadow:0 0 22px 8px rgba(255,190,110,.55);animation:rise linear forwards}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,20px),-115vh);opacity:.2}}

/* ───── no WebGL notice ───── */

  };

  /* ── scrapbook placeholder illustrations ── */
  function doodle(kind) {
    const ink = "#4A2C36", s = 'stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"';
    const heartPath = (x, y, k, fillc) => `<path transform="translate(${x} ${y}) scale(${k})" d="M0 9C-5-2-18 1-14 12 -11 19 0 25 0 25S11 19 14 12C18 1 5-2 0 9z" fill="${fillc}" ${s}/>`;
    const bgs = { heart: ["#FCE3E8", "#F9CFD8"], cups: ["#EAF2E0", "#FFF1DC"], cat: ["#FFE9D6", "#FCD9C4"], paws: ["#FFE9D6", "#FCD9C4"], sunset: ["#FFD8C2", "#F7B2B9"], stars: ["#6E5A8A", "#B9799A"] };
    const [a, b] = bgs[kind] || bgs.heart;

      ${kind === "paws" ? '<g fill="' + ink + '" opacity=".22"><circle cx="50" cy="60" r="7"/><circle cx="40" cy="47" r="4"/><circle cx="52" cy="42" r="4"/><circle cx="63" cy="48" r="4"/><circle cx="270" cy="70" r="7"/><circle cx="260" cy="57" r="4"/><circle cx="272" cy="52" r="4"/><circle cx="283" cy="58" r="4"/></g>' : ""}
      <text x="250" y="110" font-family="Patrick Hand, cursive" font-size="26" fill="${ink}">z z</text>`;
    } else if (kind === "sunset") {
      art = `<circle cx="200" cy="120" r="44" fill="#FFE7A6" ${s}/>

      <path d="M0 200c70-24 120-24 170-6s100 14 150-4V240H0z" fill="#4E3E66"/>

  }

  /* ── dates ── */
  function parseYMD(str) {
    const m = /^\s*\[?(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\]?\s*$/.exec(String(str || ""));
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3], dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return { y, mo, d };
  }
  function todayYMD() { const n = new Date(); return { y: n.getFullYear(), mo: n.getMonth() + 1, d: n.getDate() }; }
  const dayDiff = (a, b) => Math.round((Date.UTC(b.y, b.mo - 1, b.d) - Date.UTC(a.y, a.mo - 1, a.d)) / 864e5);
  function monthsAndDays(a, b) {
    let months = (b.y - a.y) * 12 + (b.mo - a.mo);
    if (b.d < a.d) months--;
    const anchorY = a.y + Math.floor((a.mo - 1 + months) / 12), anchorM = ((a.mo - 1 + months) % 12) + 1;
    const lastDay = new Date(anchorY, anchorM, 0).getDate();
    const anchor = { y: anchorY, mo: anchorM, d: Math.min(a.d, lastDay) };
    return { months, days: dayDiff(anchor, b) };
  }
  const startDate = parseYMD(GIFT.togetherSince);
  const daysTogether = startDate ? dayDiff(startDate, todayYMD()) : null;
  const showCounter = daysTogether !== null && daysTogether >= 0;

  /* ── fill static text ── */
  $("#inviteTo").textContent = fill(GIFT.text.inviteTo);
  $("#inviteTitle").textContent = fill(GIFT.text.inviteTitle);
  $("#inviteFrom").textContent = fill(GIFT.text.inviteFrom);
  $("#openBtn").textContent = fill(GIFT.text.openButton);
  $("#cssEnvTo").textContent = "For " + GIFT.herName;
  $("#brand").innerHTML = esc(GIFT.yourName) + ' <span class="amp">&amp;</span> ' + esc(GIFT.herName);
  $("#finaleNames").textContent = GIFT.yourName + " & " + GIFT.herName;
  $("#finaleTitle").textContent = fill(GIFT.text.finaleTitle);
  $("#finaleMsg").textContent = GIFT.anniversaryMessage;
  if (showCounter) {
    const md = monthsAndDays(startDate, todayYMD());
    const fmt = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric", year: "numeric" });
    const sinceStr = fmt.format(new Date(startDate.y, startDate.mo - 1, startDate.d));
    let extra = "";
    if (md.months >= 1) extra = " · that's " + md.months + (md.months === 1 ? " month" : " months") + (md.days ? " and " + md.days + (md.days === 1 ? " day" : " days") : "");
    $("#sinceLine").textContent = "since " + sinceStr + extra;
    $("#dayUnit").textContent = daysTogether === 1 ? "day together" : daysTogether === 0 ? GIFT.text.dayOneUnit : GIFT.text.daysUnit;
  } else {
    $("#counterWrap").hidden = true;
  }

  /* ── visibility helpers with fade ── */
  function show(el) { clearTimeout(el._ft); el.hidden = false; void el.offsetWidth; el.classList.add("on"); }
  function hide(el, cb) { clearTimeout(el._ft); el.classList.remove("on"); el._ft = setTimeout(() => { el.hidden = true; cb && cb(); }, reduced ? 0 : 450); }

  /* ════════════════ sections / navigation ════════════════ */
  const SECTIONS = [
    { key: "story",  short: "Our story",     title: "Our story",                     eyebrow: "pages from us" },
    { key: "notes",  short: "Little things", title: "Little things I love about you", eyebrow: "pick a flower" },
    { key: "letter", short: "A letter",      title: "A letter for you",              eyebrow: "from the mailbox" },
    { key: "future", short: "Adventures",    title: "More adventures together",      eyebrow: "under our tree" },
    { key: "finale", short: "Our day",       title: "Our anniversary",               eyebrow: "" }
  ];
  const byKey = k => SECTIONS.find(s => s.key === k);
  const visited = new Set();

  const dock = $("#dock");
  dock.innerHTML = SECTIONS.map(s => `<button class="dock-btn${s.key === "finale" ? " special" : ""}" type="button" data-go="${s.key}">${ICON[s.key]}<span class="lbl">${esc(s.short)}</span></button>`).join("");
  on(dock, "click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go, b); });

  let mode = "invite";       // invite | opening | island | panel | finale
  let current = null;        // open panel key
  let lastOpener = null;
  let world = null;          // 3D controller (null without WebGL)

  function markVisited(k) {
    visited.add(k);
    dock.querySelectorAll(`[data-go="${k}"]`).forEach(b => b.classList.add("visited"));
    if (world) world.markVisited(k);
  }

  function go(key, opener) {
    if (mode === "invite" || mode === "opening") return;
    hideHint();
    if (key === "finale") return openFinale();
    openPanel(key, opener);
  }

  /* ── panel ── */
  const panel = $("#panel"), pBody = $("#panelBody");
  let storyIdx = 0, noteOrder = [], notePos = -1;

  function openPanel(key, opener) {
    const sec = byKey(key);
    if (!sec) return;
    if (mode === "finale") closeFinale(true);
    lastOpener = opener || document.activeElement;
    current = key; mode = "panel";
    $("#panelTitle").textContent = sec.title;
    $("#panelEyebrow").textContent = sec.eyebrow;
    renderPanel(key);
    const idx = SECTIONS.findIndex(s => s.key === key);
    const next = SECTIONS[idx + 1];
    const nextBtn = $("#panelNext");
    nextBtn.textContent = next ? "Next: " + next.short + " →" : "";
    nextBtn.hidden = !next;
    nextBtn.dataset.next = next ? next.key : "";
    hide(dock);
    app.classList.add("panel-open");
    show(panel);
    pBody.scrollTop = 0;
    markVisited(key);
    if (world) world.focus(key, panelInsets());
    setTimeout(() => $("#panelTitle").focus({ preventScroll: true }), reduced ? 0 : 60);
  }
  function closePanel(silent) {
    if (mode !== "panel") return;
    mode = "island"; current = null;
    app.classList.remove("panel-open");
    hide(panel);
    if (!silent) {
      show(dock);
      if (world) world.overview();
      const target = lastOpener && document.body.contains(lastOpener) && lastOpener.offsetParent ? lastOpener : dock.querySelector("button");
      setTimeout(() => target && target.focus({ preventScroll: true }), reduced ? 0 : 80);
    }
  }
  function panelInsets() {
    const w = app.clientWidth, h = app.clientHeight;
    if (w >= 820) return { x: Math.min(460, w * 0.44) / 2 + 8, y: 0 };
    return { x: 0, y: h * 0.76 / 2 };
  }
  on($("#panelClose"), "click", () => closePanel());
  on($("#panelBack"), "click", () => closePanel());
  on($("#panelNext"), "click", e => { const n = e.currentTarget.dataset.next; if (!n) return; if (n === "finale") { closePanel(true); openFinale(); } else openPanel(n, lastOpener); });

  function badge(txt) { return GIFT.showExampleBadges ? `<span class="badge">${esc(txt || "Example — replace in the config")}</span>` : ""; }

  /* ════════════════ our own content (optional backend) ════════════════
     With GIFT.backend.apiUrl set and one of us signed in, the panels show and
     edit what we saved. Signed out, offline, or inside the artifact preview,
     everything falls back to the GIFT config above. */
  const API = (() => {
    const url = String((GIFT.backend && GIFT.backend.apiUrl) || "").replace(/\/+$/, "");
    const host = location.hostname;
    const preview = location.origin === "null" || !/^https?:$/.test(location.protocol) ||
      /(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/.test(host);
    return { url, enabled: !!url && !preview };
  })();
  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  const SESSION_KEY = "olw-session";
  const auth = { access: "", exp: 0, refresh: "", name: "" };
  let live = null;            // { letters, milestones, notes, events } once loaded
  let loading = false;
  let editing = null;         // form open in the panel: { res, item }
  const photoUrls = new Map();

  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); if (s && s.refresh) { auth.refresh = s.refresh; auth.name = s.name || ""; } } catch (e) { /* storage unavailable */ }
  function saveSession() {
    try { if (auth.refresh) localStorage.setItem(SESSION_KEY, JSON.stringify({ refresh: auth.refresh, name: auth.name })); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* storage unavailable */ }
  }
  function jwtExp(t) { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000; } catch (e) { return 0; } }
  function setTokens(d) { auth.access = d.accessToken; auth.exp = jwtExp(d.accessToken); auth.refresh = d.refreshToken; auth.name = d.member.name; saveSession(); }
  function forget() {
    auth.access = auth.refresh = auth.name = ""; auth.exp = 0; saveSession();
    live = null; editing = null;
    photoUrls.forEach(u => URL.revokeObjectURL(u)); photoUrls.clear();
  }

  async function raw(method, path, body, headers) {
    const h = Object.assign({}, headers);
    let payload;
    if (body instanceof Blob) { h["Content-Type"] = body.type; payload = body; }
    else if (body !== undefined) { h["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
    let res;
    try { res = await fetch(API.url + path, { method, headers: h, body: payload }); }
    catch (e) { throw new ApiError(0, "We couldn't reach our little server. Check the connection and try again."); }
    if (res.status === 204) return null;
    const ct = res.headers.get("content-type") || "";
    if (!res.ok) {
      let msg = "Something went wrong (" + res.status + "). Please try again.";
      if (ct.includes("json")) { try { msg = (await res.json()).error || msg; } catch (e) { /* keep default */ } }
      throw new ApiError(res.status, msg);
    }
    return ct.includes("json") ? res.json() : res.blob();
  }
  let refreshing = null;
  async function token(force) {
    if (!force && auth.access && auth.exp - 30000 > Date.now()) return auth.access;
    if (!auth.refresh) throw new ApiError(401, "Please sign in");
    if (!refreshing) {
      refreshing = raw("POST", "/auth/refresh", { refreshToken: auth.refresh })
        .then(setTokens)
        .catch(e => { if (e.status === 401 || e.status === 403) { forget(); contentChanged(); } throw e; })
        .finally(() => { refreshing = null; });
    }
    await refreshing;
    return auth.access;
  }
  async function api(method, path, body) {
    try { return await raw(method, path, body, { Authorization: "Bearer " + await token() }); }
    catch (e) {
      if (e.status !== 401 || !auth.refresh) throw e;
      return raw(method, path, body, { Authorization: "Bearer " + await token(true) });
    }
  }
  async function photoUrl(key) {
    if (!key) return "";
    if (photoUrls.has(key)) return photoUrls.get(key);
    try { const u = URL.createObjectURL(await api("GET", "/" + key)); photoUrls.set(key, u); return u; }
    catch (e) { return ""; }
  }
  async function loadLive() {
    loading = true; contentChanged();
    try {
      const d = await api("GET", "/content");
      await Promise.all(d.milestones.map(m => photoUrl(m.photoKey)));
      const keep = new Set(d.milestones.map(m => m.photoKey).filter(Boolean));
      photoUrls.forEach((u, k) => { if (!keep.has(k)) { URL.revokeObjectURL(u); photoUrls.delete(k); } });
      live = d;
    } finally { loading = false; contentChanged(); }
  }
  function contentChanged() {
    if (world) { world.setMemories(memories()); world.setFlowerCount(noteList().length); }
    updateAccount();
    if (mode === "panel" && current && !editing) renderPanel(current);
  }

  /* ── content accessors: live rows when signed in, the GIFT config otherwise ── */
  const DOODLES = ["heart", "cups", "paws", "sunset", "stars", "cat"];
  const longFmt = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric", year: "numeric" });
  const shortFmt = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" });
  const ymdDate = s => { const p = parseYMD(s); return p ? new Date(p.y, p.mo - 1, p.d) : null; };
  const fmtLong = s => { const d = ymdDate(s); return d ? longFmt.format(d) : ""; };
  const ymd = (y, mo, d) => y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  const todayStr = () => { const t = todayYMD(); return ymd(t.y, t.mo, t.d); };
  function fmtTime(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    return new Date(2000, 0, 1, h, m).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  function memories() {
    if (!live) return GIFT.memories;
    return live.milestones.map((m, i) => ({ id: m.id, date: fmtLong(m.date), title: m.title, caption: m.caption,
      photo: photoUrls.get(m.photoKey) || "", alt: m.photoAlt, doodle: DOODLES[i % DOODLES.length], author: m.author }));
  }
  const noteList = () => live ? live.notes : GIFT.loveNotes.map(text => ({ text }));
  const canEdit = () => !!live;
  const byLine = (who, verb) => who ? `<span class="by">${verb || "from"} ${esc(who)}</span>` : "";
  function actions(res, id, label) {
    return `<div class="actions"><button class="mini" type="button" data-act="edit" data-res="${res}" data-id="${id}">Edit<span class="sr-only"> ${esc(label)}</span></button>` +
      `<button class="mini danger" type="button" data-act="delete" data-res="${res}" data-id="${id}">Delete<span class="sr-only"> ${esc(label)}</span></button></div>`;
  }
  function header(res, addLabel) {
    if (canEdit()) return `<div class="panel-tools"><button class="btn btn-soft btn-sm" type="button" data-act="add" data-res="${res}">+ ${esc(addLabel)}</button>${byLine(auth.name, "signed in as")}</div>`;
    if (API.enabled && auth.refresh && loading) return `<p class="nudge">Loading our things…</p>`;
    if (API.enabled) return `<p class="nudge">These are the examples from the config. <button type="button" data-act="signin">Sign in</button> to see and add our own.</p>`;
    return "";
  }

  /* ── forms ── */
  const KINDS = { date: "Date", trip: "Trip", food: "Food & drinks", home: "At home", celebration: "Celebration", other: "Something else" };
  const KIND_ICON = { date: "heart", trip: "map", food: "cup", home: "pan", celebration: "star", other: "basket" };
  const FORMS = {
    letters: { noun: "letter", fields: [
      { k: "title", label: "Title", type: "text", req: true, max: 200 },
      { k: "date", label: "Date on the letter", type: "date" },
      { k: "body", label: "Letter", type: "textarea", req: true, max: 20000, rows: 10, hint: "Leave a blank line between paragraphs." }] },
    milestones: { noun: "milestone", fields: [
      { k: "date", label: "Date", type: "date", req: true },
      { k: "title", label: "Title", type: "text", req: true, max: 200 },
      { k: "caption", label: "Caption", type: "textarea", max: 2000, rows: 4 },
      { k: "photo", label: "Photo", type: "photo" },
      { k: "photoAlt", label: "Describe the photo", type: "text", max: 300, hint: "Read aloud by screen readers." }] },
    notes: { noun: "little thing", fields: [
      { k: "text", label: "A little thing I love about you", type: "textarea", req: true, max: 500, rows: 3 }] },
    events: { noun: "plan", fields: [
      { k: "title", label: "What", type: "text", req: true, max: 200 },
      { k: "date", label: "Date", type: "date", hint: "Leave empty for a someday idea.", half: true },
      { k: "time", label: "Time (optional)", type: "time", half: true },
      { k: "location", label: "Where", type: "text", max: 200 },
      { k: "kind", label: "Kind", type: "select", options: KINDS },
      { k: "note", label: "Note", type: "textarea", max: 2000, rows: 3 },
      { k: "done", label: "We did this together", type: "checkbox" }] }
  };
  let pendingPhoto = null;    // { blob, url } chosen in the open milestone form, or "remove"

  function fieldHtml(f, v) {
    const id = "f-" + f.k, req = f.req ? " required" : "", max = f.max ? ` maxlength="${f.max}"` : "";
    const hint = f.hint ? `<span class="hint" id="${id}-h">${esc(f.hint)}</span>` : "";
    const desc = f.hint ? ` aria-describedby="${id}-h"` : "";
    if (f.type === "checkbox") return `<label class="check"><input type="checkbox" name="${f.k}"${v ? " checked" : ""}> ${esc(f.label)}</label>`;
    if (f.type === "photo") {
      const src = v ? esc(v) : "";
      return `<div class="field"><span>${esc(f.label)}</span><div class="photo-pick" id="photoPick">${src ? `<img src="${src}" alt="Current photo">` : ""}

    const shadowTex = radialTexture("rgba(120,40,70,0.55)", "rgba(120,40,70,0)");
    const envShadow = new T.Sprite(new T.SpriteMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.55 }));
    envShadow.scale.set(EW * 1.5, EH * 1.25, 1); envShadow.position.set(0.05, -0.16, -0.35); envG.add(envShadow);
    const envMats = [paperMat, frontMat, card.material, flapFront.material, flapBack.material, seal.material, sealHeart.material, envShadow.material];

    /* ── hotspots & tags ── */
    const HOT = {
      story:  { group: photoG,  anchor: new T.Vector3(1.35, TOP + 1.55, -1.3),  lift: 0.7, face: 0.2,  dist: 4.4 },
      notes:  { group: gardenG, anchor: new T.Vector3(-1.6, TOP + 1.12, 1.2),   lift: 0.4, face: -0.35, dist: 4.4 },
      letter: { group: mailG,   anchor: new T.Vector3(1.95, TOP + 1.55, 1.15),  lift: 0.85, face: 0.1, dist: 4.2 },
      future: { group: benchG,  anchor: new T.Vector3(-0.85, TOP + 1.2, -0.45), lift: 0.55, face: 0.2, dist: 5.2, phi: 1.0 },
      finale: { group: heartG,  anchor: new T.Vector3(0.9, 3.4, -0.3),        lift: 0,   face: 0,    dist: 6 }
    };
    Object.keys(HOT).forEach(k => HOT[k].group.traverse(o => { o.userData.hot = k; }));
    const tagLayer = $("#tags");
    tagLayer.innerHTML = SECTIONS.map(s => `<button class="tag" type="button" tabindex="-1" data-go="${s.key}"><span class="pip"></span>${esc(s.short)}</button>`).join("");
    const tagEls = {};
    tagLayer.querySelectorAll(".tag").forEach(el => { tagEls[el.dataset.go] = el; on(el, "click", () => go(el.dataset.go, dock.querySelector(`[data-go="${el.dataset.go}"]`))); });

    /* ── camera rig ── */
    let W = 1, H = 1, aspect = 1;
    const cam = { tx: 0, ty: 3, tz: 0, theta: 0, phi: 1.47, r: 26 };
    let tween = null;
    const vel = { th: 0, ph: 0 };
    const viewOff = { x: 0, y: 0, tx: 0, ty: 0 };
    const fitR = base => Math.max(base, (base * 0.64) / (0.728 * Math.min(aspect, 1.1)) * 0.92);
    const overviewView = () => ({ tx: 0, ty: 0.7, tz: 0, theta: 0.55, phi: 1.16, r: fitR(11.5) });
    const inviteView = () => ({ tx: 0, ty: 3.2, tz: 0, theta: 0, phi: 1.47, r: 26 });
    const finaleView = () => ({ tx: 0, ty: 3.4, tz: 0, theta: cam.theta, phi: 1.5, r: fitR(14) });
    function focusView(key) {
      const g = HOT[key].group, p = g.getWorldPosition(new T.Vector3());
      return { tx: p.x, ty: p.y + HOT[key].lift, tz: p.z, theta: g.rotation.y + HOT[key].face, phi: HOT[key].phi || 1.14, r: fitR(HOT[key].dist) };
    }
    const wrapA = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
    const ease = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    function goTo(v, dur, done) {
      if (reduced || !dur) { Object.assign(cam, v); tween = null; done && done(); return; }
      const to = Object.assign({}, v); to.theta = cam.theta + wrapA(v.theta - cam.theta);
      tween = { from: Object.assign({}, cam), to, t: 0, dur, done };
      vel.th = vel.ph = 0;
    }
    function applyCamera() {
      const s = Math.sin(cam.phi);
      camera.position.set(cam.tx + cam.r * s * Math.sin(cam.theta), cam.ty + cam.r * Math.cos(cam.phi), cam.tz + cam.r * s * Math.cos(cam.theta));
      camera.lookAt(cam.tx, cam.ty, cam.tz);
    }
    function placeEnvelope() {
      const v = inviteView(), s = Math.sin(v.phi);
      const cp = new T.Vector3(v.tx + v.r * s * Math.sin(v.theta), v.ty + v.r * Math.cos(v.phi), v.tz + v.r * s * Math.cos(v.theta));
      const dir = new T.Vector3(v.tx, v.ty, v.tz).sub(cp).normalize();
      const tanH = Math.tan(T.MathUtils.degToRad(20));
      const d = Math.max((EH / 0.34) / (2 * tanH), (EW / 0.72) / (2 * tanH * aspect));
      envG.userData.base = cp.clone().add(dir.multiplyScalar(d)).add(new T.Vector3(0, -0.05 * 2 * d * tanH, 0));
      envG.userData.cam = cp;
      envG.position.copy(envG.userData.base);
      envG.lookAt(cp);
    }

    function resize() {
      W = app.clientWidth || window.innerWidth; H = app.clientHeight || window.innerHeight; aspect = W / H;
      renderer.setSize(W, H, false);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      placeEnvelope();
      if (state === "island" && !tween) { const o = overviewView(); cam.r = Math.min(Math.max(cam.r, o.r * 0.6), o.r * 1.5); }
      if (state === "invite") Object.assign(cam, inviteView());
    }

    /* ── pointer: orbit, pinch, tap ── */
    const pointers = new Map();
    let downInfo = null, pinch0 = 0, idleT = 0;
    const ray = new T.Raycaster(), ndc = new T.Vector2();
    function pick(ex, ey, objs) {
      const rect = canvas.getBoundingClientRect();
      ndc.set(((ex - rect.left) / rect.width) * 2 - 1, -((ey - rect.top) / rect.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(objs, true)[0];
      return hit ? hit.object : null;
    }
    const hotList = Object.keys(HOT).map(k => HOT[k].group);
    on(canvas, "pointerdown", e => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
      if (pointers.size === 1) downInfo = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
      if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); }
      idleT = 0;
    });
    on(canvas, "pointermove", e => {
      const p = pointers.get(e.pointerId);
      if (!p) {
        if (e.pointerType === "mouse" && (state === "island" || state === "panel")) {
          const o = pick(e.clientX, e.clientY, hotList);
          canvas.className = o ? "point" : "grab";
        } else if (e.pointerType === "mouse" && state === "invite") {
          canvas.className = pick(e.clientX, e.clientY, [envG]) ? "point" : "";
        }
        return;
      }
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (downInfo) downInfo.moved += Math.abs(dx) + Math.abs(dy);
      if (!(state === "island" || state === "panel" || state === "finale")) return;
      if (pointers.size === 1) {
        tween = null;
        vel.th = -dx * 0.0055; vel.ph = -dy * 0.004;
        cam.theta += vel.th; cam.phi = Math.min(1.5, Math.max(0.72, cam.phi + vel.ph));
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch0) { const o = overviewView().r; cam.r = Math.min(o * 1.45, Math.max(o * 0.5, cam.r * (pinch0 / d))); }
        pinch0 = d; tween = null;
      }
    });
    const endPointer = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch0 = 0;
      if (pointers.size === 0 && downInfo && e.type === "pointerup") {
        if (downInfo.moved < 8 && performance.now() - downInfo.t < 600) onTap(e.clientX, e.clientY);
        downInfo = null;
      }
    };
    on(canvas, "pointerup", endPointer);
    on(canvas, "pointercancel", endPointer);
    on(canvas, "wheel", e => {
      if (!(state === "island" || state === "panel")) return;
      e.preventDefault();
      const o = overviewView().r;
      cam.r = Math.min(o * 1.45, Math.max(o * 0.5, cam.r * (1 + Math.sign(e.deltaY) * 0.08)));
      tween = null;
    }, { passive: false });
    on(window, "keydown", e => {
      if (state !== "island" || e.target.closest && e.target.closest("input,textarea")) return;
      if (e.key === "ArrowLeft") { tween = null; vel.th = 0.06; }
      if (e.key === "ArrowRight") { tween = null; vel.th = -0.06; }
    });
    function onTap(x, y) {
      if (state === "invite") { if (pick(x, y, [envG])) openSurprise(); return; }
      if (state === "island" || state === "panel") {
        const o = pick(x, y, hotList);
        if (o && o.userData.hot) {
          if (o.userData.hot === "notes" && current === "notes") { nextNote(); return; }
          go(o.userData.hot, dock.querySelector(`[data-go="${o.userData.hot}"]`));
        }
      }
    }

    /* ── lanterns ── */
    const lanternGeo = new T.CylinderGeometry(0.1, 0.075, 0.22, 12, 1, true);
    const lanternMat = new T.MeshBasicMaterial({ color: 0xFFC27E, side: T.DoubleSide, fog: false });
    const lanternTop = new T.CylinderGeometry(0.03, 0.1, 0.03, 12);
    const lanternTopMat = new T.MeshBasicMaterial({ color: 0xD9785E, fog: false });
    let lanterns = [], lanternsOn = false, dusk = 0;
    function spawnLantern(L, initial) {
      const a = Math.random() * 6.283, r = 1.4 + Math.random() * 4.6;
      L.position.set(Math.cos(a) * r, initial ? -3 + Math.random() * 8 : -3.5 - Math.random() * 1.5, Math.sin(a) * r);
      L.userData.speed = 0.5 + Math.random() * 0.45; L.userData.ph = Math.random() * 6.28; L.userData.age = 0;
    }
    function startLanterns() {
      lanternsOn = true;
      if (!lanterns.length) {
        for (let i = 0; i < 30; i++) {
          const L = new T.Group();
          L.add(new T.Mesh(lanternGeo, lanternMat));
          const top = new T.Mesh(lanternTop, lanternTopMat); top.position.y = 0.125; L.add(top);
          const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0.9, depthWrite: false, blending: T.AdditiveBlending, fog: false }));
          glow.scale.set(0.9, 0.9, 1); L.add(glow); L.userData.glow = glow;
          scene.add(L); lanterns.push(L);
        }
      }
      lanterns.forEach((L, i) => {
        spawnLantern(L, true); L.visible = true;
        if (reduced) L.position.set(Math.cos(i * 2.4) * (1.5 + (i % 5)), 1 + (i % 7) * 1.1, Math.sin(i * 2.4) * (1.5 + (i % 5)));
      });
    }

    /* ── state ── */
    let state = "invite", opening = null, focusedPhoto = -1;
    Object.assign(cam, inviteView());
    resize();

    /* ── loop ── */
    let raf = 0, last = performance.now(), elapsed = 0;
    const tmpV = new T.Vector3(), camDir = new T.Vector3();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      elapsed += dt;
      update(dt, elapsed);
      renderer.render(scene, camera);
      placeTags();
    }
    function update(dt, t) {
      const calm = reduced ? 0 : 1;
      world.position.y = Math.sin(t * 0.6) * 0.07 * calm;
      clouds.forEach(c => { const u = c.userData; u.a += u.sp * dt * calm; c.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.3 + u.ph) * 0.2 * calm, Math.sin(u.a) * u.r); });
      rocks.forEach(r => { const u = r.userData; u.a += 0.05 * dt * calm; r.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t + u.a * 3) * 0.12 * calm, Math.sin(u.a) * u.r); r.rotation.y += 0.2 * dt * calm; });
      sparkles.rotation.y += 0.02 * dt * calm;
      sparkles.material.opacity = 0.6 + Math.sin(t * 1.3) * 0.25 * calm;
      if (calm) {
        petals.forEach(p => {
          const u = p.userData;
          if (p.position.y > TOP + 0.04) { p.position.y -= u.speed * dt; p.position.x += Math.sin(t * 1.4 + u.phase) * 0.004; p.position.z += Math.cos(t * 1.1 + u.phase) * 0.003; p.rotation.x += 1.2 * dt; p.rotation.y += 0.8 * dt; }
          else { u.rest += dt; p.rotation.set(-Math.PI / 2, 0, u.phase); if (u.rest > 4) resetPetal(p, false); }
        });
        flowers.forEach(f => { const u = f.userData; u.wig = Math.max(0, u.wig - dt * 1.2); f.rotation.z = Math.sin(t * 1.3 + u.phase) * (0.06 + u.wig * 0.25); f.rotation.x = Math.cos(t * 1.1 + u.phase) * (0.04 + u.wig * 0.15); });
        polaroids.forEach(pv => { const u = pv.userData; u.boost = Math.max(0, u.boost - dt * 0.8); pv.rotation.z = Math.sin(t * 1.2 + u.phase) * (0.06 + u.boost * 0.2); pv.rotation.x = Math.sin(t * 0.9 + u.phase) * 0.05; });
        foliage.forEach((f, i) => { f.position.x += Math.sin(t * 0.8 + i) * 0.0006; });
        catBody.scale.y = 0.12 * (1 + Math.sin(t * 2.2) * 0.04);
        flagG.rotation.z = Math.sin(t * 2.4) * 0.05;
        steam.position.y = 0.18 + Math.sin(t * 1.5) * 0.02; steamMat.opacity = 0.25 + Math.sin(t * 1.5) * 0.1;
      }
      heartG.rotation.y = calm ? t * 0.7 : 0.4;
      heartG.position.y = 2.85 + Math.sin(t * 1.4) * 0.1 * calm;
      heartGlow.material.opacity = 0.55 + Math.sin(t * 2) * 0.15 * calm;

      /* envelope idle + opening */
      if (state === "invite" && envG.visible) {
        const b = envG.userData.base;
        envG.position.set(b.x, b.y + Math.sin(t * 1.2) * 0.06 * calm, b.z);
        envG.lookAt(envG.userData.cam);
        envG.rotateZ(Math.sin(t * 0.8) * 0.03 * calm); envG.rotateY(Math.sin(t * 0.6) * 0.06 * calm);
      }
      if (opening) {
        opening.t += dt;
        const k = opening.t, cl = x => Math.max(0, Math.min(1, x));
        const ks = cl(k / 0.4);
        sealG.scale.setScalar(ks < 0.35 ? 1 + ks * 0.6 : Math.max(0.001, 1.2 * (1 - (ks - 0.35) / 0.65)));
        sealG.position.z = ED / 2 + 0.04 + ks * 0.2;
        flapPivot.rotation.x = -Math.PI * 1.04 * ease(cl((k - 0.3) / 0.85));
        card.position.y = CARD_Y0 + 0.98 * ease(cl((k - 1.05) / 0.9));
        if (k > 2.75 && !opening.cam) { opening.cam = true; goTo(overviewView(), 2.8, () => { const d = opening.done; opening = null; envG.visible = false; state = "island"; d && d(); }); }
        const kf = cl((k - 2.4) / 0.9);
        if (kf > 0) {
          envMats.forEach(m => { m.transparent = true; m.opacity = (m === envShadow.material ? 0.55 : 1) * (1 - kf); });
          const b = envG.userData.base, e = ease(kf);
          envG.position.set(b.x, b.y - e * 1.6, b.z - e * 0.6);
          envG.scale.setScalar(Math.max(0.001, 1 - e * 0.5));
          if (kf >= 1) envG.visible = false;
        }
      }

      /* camera */
      if (tween) {
        tween.t += dt;
        const k = ease(Math.min(1, tween.t / tween.dur)), f = tween.from, to = tween.to;
        ["tx", "ty", "tz", "theta", "phi", "r"].forEach(key => { cam[key] = f[key] + (to[key] - f[key]) * k; });
        if (tween.t >= tween.dur) { const d = tween.done; tween = null; d && d(); }
      } else if (state === "island" || state === "panel" || state === "finale") {
        if (!pointers.size) {
          cam.theta += vel.th; cam.phi = Math.min(1.5, Math.max(0.72, cam.phi + vel.ph));
          vel.th *= 0.92; vel.ph *= 0.9;
          idleT += dt;
          if (calm && state === "island" && idleT > 8) cam.theta += 0.03 * dt;
          if (calm && state === "finale") cam.theta += 0.04 * dt;
        }
      }
      applyCamera();
      viewOff.x += (viewOff.tx - viewOff.x) * Math.min(1, dt * (reduced ? 60 : 4));
      viewOff.y += (viewOff.ty - viewOff.y) * Math.min(1, dt * (reduced ? 60 : 4));
      if (Math.abs(viewOff.x) > 0.5 || Math.abs(viewOff.y) > 0.5) camera.setViewOffset(W, H, viewOff.x, viewOff.y, W, H);
      else if (camera.view && camera.view.enabled) camera.clearViewOffset();

      /* dusk + lanterns */
      dusk += ((lanternsOn ? 1 : 0) - dusk) * Math.min(1, dt * (reduced ? 60 : 1.2));
      sun.intensity = 0.85 - dusk * 0.35; hemi.intensity = 0.72 - dusk * 0.2;
      scene.fog.color.copy(fogDay).lerp(fogDusk, dusk);
      let anyVisible = false;
      lanterns.forEach((L, i) => {
        if (!L.visible) return;
        anyVisible = true;
        const u = L.userData;
        if (!reduced) {
          L.position.y += u.speed * dt;
          L.position.x += Math.sin(t * 0.7 + u.ph) * 0.003;
          L.rotation.y += 0.3 * dt;
          if (L.position.y > 16) { if (lanternsOn) spawnLantern(L, false); else L.visible = false; }
        }
        u.age += dt;
        const fadeIn = reduced ? 1 : Math.min(1, u.age / 1.6);
        L.scale.setScalar(Math.max(0.001, fadeIn));
        u.glow.material.opacity = (0.75 + Math.sin(t * 6 + u.ph) * 0.12 * calm) * fadeIn * Math.min(1, Math.max(0, (17 - L.position.y) / 4));
      });
      if (!anyVisible && !lanternsOn && lanterns.length) lanterns.forEach(L => (L.visible = false));
    }

    function placeTags() {
      const showTags = state === "island" && !tween;
      tagLayer.style.visibility = showTags ? "visible" : "hidden";
      if (!showTags) return;
      camera.getWorldDirection(camDir);
      Object.keys(HOT).forEach(k => {
        const el = tagEls[k];
        tmpV.copy(HOT[k].anchor); world.localToWorld(tmpV);
        const toObj = tmpV.clone().sub(camera.position);
        const behind = toObj.dot(camDir) < 0;
        const flat = new T.Vector3(tmpV.x, 0, tmpV.z), cflat = new T.Vector3(camera.position.x, 0, camera.position.z);
        const far = k !== "finale" && flat.lengthSq() > 0.01 && flat.normalize().dot(cflat.normalize()) < -0.55;
        tmpV.project(camera);
        const x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * H;
        el.style.transform = `translate3d(${x.toFixed(1)}px, ${(y - 10).toFixed(1)}px, 0) translate(-50%, -100%)`;
        el.style.opacity = behind ? 0 : far ? 0.45 : 1;
        el.style.pointerEvents = behind ? "none" : "auto";
      });
    }

    /* visibility: pause when hidden */
    const vis = () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
    on(document, "visibilitychange", vis);
    let ro = null;
    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(app); } else on(window, "resize", resize);
    raf = requestAnimationFrame(frame);
    canvas.className = "";

    return {
      open(done) {
        state = "opening";
        if (reduced) { envG.visible = false; goTo(overviewView(), 0); state = "island"; done(); return; }
        opening = { t: 0, done };
      },
      reset() {
        opening = null; lanternsOn = false;
        lanterns.forEach(L => (L.visible = false));
        state = "resetting";
        viewOff.tx = viewOff.ty = 0;
        envG.visible = true; envG.scale.setScalar(1);
        envMats.forEach(m => { m.opacity = m === envShadow.material ? 0.55 : 1; m.transparent = m === envShadow.material; });
        sealG.scale.setScalar(1); sealG.position.z = ED / 2 + 0.04;
        flapPivot.rotation.x = 0; card.position.y = CARD_Y0;
        placeEnvelope();
        canvas.className = "";
        goTo(inviteView(), 2.2, () => { state = "invite"; });
        if (reduced) state = "invite";
      },
      focus(key, inset) {
        state = "panel";
        viewOff.tx = inset.x; viewOff.ty = inset.y;
        goTo(focusView(key), 1.6);
        if (key === "story") polaroids.forEach(p => (p.userData.boost = 1));
        if (key === "notes") flowers.forEach(f => (f.userData.wig = 1));
      },
      overview() {
        state = "island";
        viewOff.tx = viewOff.ty = 0;
        const v = overviewView(); v.theta = cam.theta;
        goTo(v, 1.5);
        canvas.className = "grab";
      },
      finale(onFlag) {
        if (onFlag) {
          state = "finale";
          viewOff.tx = 0; viewOff.ty = app.clientWidth < 820 ? Math.min(app.clientHeight * 0.18, 150) : 60;
          goTo(finaleView(), 2.2);
          startLanterns();
        } else { lanternsOn = false; state = "island"; }
      },
      markVisited(k) { tagEls[k] && tagEls[k].classList.add("visited"); },
      highlightPhoto(i) { const p = polaroids[photoSlots[i % photoSlots.length]]; if (p && i !== focusedPhoto) { p.userData.boost = 1.2; focusedPhoto = i; } },
      wiggleFlowers() { flowers.forEach(f => (f.userData.wig = 1)); },
      setMemories,
      setFlowerCount(n) { const k = Math.max(1, Math.min(flowers.length, n)); flowers.forEach((f, i) => (f.visible = i < k)); },
      destroy() {
        cancelAnimationFrame(raf); ro && ro.disconnect();
        scene.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.map && m.map.dispose(); m.dispose(); });
        });
        renderer.dispose();
      }
    };
  }

  /* ════════════════ boot ════════════════ */
  const FALLBACK_SVG = `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 150 Q200 330 340 150 Z" fill="#E9A88E"/><path d="M110 190 Q200 290 290 190" fill="none" stroke="#F6D3BF" stroke-width="8"/>
    <ellipse cx="200" cy="150" rx="150" ry="42" fill="#A9C29B"/><ellipse cx="200" cy="146" rx="140" ry="36" fill="#B8CFA8"/>
    <rect x="105" y="92" width="10" height="50" fill="#B67F70"/><circle cx="110" cy="80" r="28" fill="#F2A7B8"/><circle cx="90" cy="92" r="18" fill="#F7BFCB"/><circle cx="130" cy="90" r="20" fill="#EE95AD"/>
    <rect x="128" y="128" width="46" height="5" rx="2" fill="#E6B48D"/><rect x="128" y="116" width="46" height="5" rx="2" fill="#E6B48D"/>
    <rect x="268" y="110" width="6" height="36" fill="#C38E72"/><rect x="256" y="96" width="30" height="18" rx="8" fill="#EE8FA8"/>
    <line x1="200" y1="96" x2="200" y2="140" stroke="#C38E72" stroke-width="4"/><line x1="250" y1="96" x2="250" y2="140" stroke="#C38E72" stroke-width="4"/>

  function useFallback(reason) {
    document.body.classList.add("no3d");
    const fa = $("#fallbackArt"); fa.innerHTML = FALLBACK_SVG; fa.hidden = true;
    const n = $("#notice"); n.textContent = reason; n.hidden = false;
    setTimeout(() => (n.hidden = true), 6000);
    on($("#openBtn"), "click", () => { fa.hidden = false; n.hidden = true; });
    on($("#finaleReplay"), "click", () => { fa.hidden = true; });
    on($("#replayBtn"), "click", () => { fa.hidden = true; });
  }

  if (window.THREE && webglOK()) {
    try { world = createWorld(); }
    catch (e) { console.warn("3D unavailable:", e); world = null; useFallback("Showing the simple version: 3D graphics are not available on this device."); }
  } else {
    useFallback("Showing the simple version: 3D graphics are not available on this device.");
  }

  updateAccount();
  if (world) world.setFlowerCount(noteList().length);
  if (API.enabled && auth.refresh) {
    loadLive().catch(e => { if (e.status !== 401 && e.status !== 403) notify("Couldn't reach our little server, so this is the saved version."); });
  }

  on(window, "pagehide", () => {
    Music.stop();
    if (world) world.destroy();
    cleanups.forEach(fn => fn());
  });
})();
